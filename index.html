<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <main class="etch">
        <header class="header"><span class='side'>Magic</span>
            <h1>Etch A Sketch</h1> <span class="side">Screen</span>
        </header>


        <section class="screen">


        </section>

        <nav class="controls">
            <button class="circle-btn" type="button" data-model="Black">Black</button>
            <button class="circle-btn" type="button" data-model="grey">Gray</button>
            <button class="circle-btn" type="button" data-model="rainbow">Rainbow</button>
            <button class="circle-btn" type="button" data-model="erase">Erase</button>
            <button class="circle-btn" type="button" id="reset">Reset</button>
        </nav>

        <form class="resize" id="resize-form" onsubmit="return false" >
            <input type="number" min="1" max="100" id="size">
            <button type="submit">Resize</button>
        </form>
    </main>

    <footer class="footer">
        Built by <a href="#">Imdad</a> | <a href="#">Source</a>
    </footer>




    <script src="app.js"></script>
</body>

</html>
